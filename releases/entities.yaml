---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
---
# JMeter Test Component - app1
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: app1-jmeter-test
  title: App1 JMeter Performance Test
  description: Performance testing component for App1 with JMeter reports
  annotations:
    flowsource.io/jmeter-app-name: "app1"
spec:
  type: service
  lifecycle: production
  owner: guests
  system: examples
---
# JMeter Test Component - app2
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: app2-jmeter-test
  title: App2 JMeter Performance Test
  description: Performance testing component for App2 with JMeter reports
  annotations:
    flowsource.io/jmeter-app-name: "app2"
spec:
  type: service
  lifecycle: production
  owner: guests
  system: examples
